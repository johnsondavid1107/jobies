            - generic [ref=e66]: "&lt;h2&gt;&lt;strong&gt;Who We Are&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;About Stripe&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world’s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone’s reach while doing the most important work of your career.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;About the team&lt;/strong&gt;&lt;strong&gt;&lt;br&gt;&lt;/strong&gt;As a member of the Partner Solutions Architecture (PSA) team, you will be responsible for providing technical guidance to Stripe’s partners. Our goal is to drive growth through co-solutioning, education and enablement with our partner organisation. The right candidate will be a critical technical liaison to the Stripe Partner Development Manager. This will involve creating comprehensive technical business plans for Partners, including identifying, incubating and bringing to market service/solution offerings built on or with Stripe. A Partner Solution Architect is someone who is intellectually curious, motivated to win, open and entrepreneurial.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;As a member of the team, PSAs build highly consultative trusted relationships with executives and technical decision makers in the customer’s organisation to provide business and technical thought leadership, and become a trusted advisor in solving mission-critical business challenges. We architect business models with them so they can drive new monetization opportunities and growth.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Responsibilities:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Work with key partners to build out their Stripe capabilities and solutions to grow their business and drive non-linear growth&lt;/li&gt; &lt;li&gt;Develop and execute enablement plans&lt;/li&gt; &lt;li&gt;Be at the forefront of technical discussions &amp;amp; solution deep-dives with partners on the value Stripe can provide to their clients&lt;/li&gt; &lt;li&gt;Engage with CTOs, engineering &amp;amp; other technical leads at key partners to share technology roadmaps, demonstrate the latest innovations, and define a solution strategy to expand the partnership revenue&lt;/li&gt; &lt;li&gt;Communicate success internally through QBRs, etc.&lt;/li&gt; &lt;li&gt;Provide oversight, guidance, and assistance during the partners sales process to ensure mutual success in joint opportunities&lt;/li&gt; &lt;li&gt;Educate the Stripe sales team on key partner solutions and capabilities&lt;/li&gt; &lt;li&gt;Serve as an advocate for key partners within specific sales regions and identify areas for sales partnership&lt;/li&gt; &lt;li&gt;Collaborate on technical content (sample code, demos, etc.) to show partners how to implement specific use cases or best practices&lt;/li&gt; &lt;li&gt;Provide Partner-focused guidance on Stripe’s product through feedback&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We’re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Requirements&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;4+ years of experience in a similar customer-facing engineering role such as solution consultant, solutions architect, sales engineer, for a global software enterprise.&lt;/li&gt; &lt;li&gt;Experience co-selling and co-solutioning with go-to-market partners.&lt;/li&gt; &lt;li&gt;Executive engagement skills and presence, with an ability to establish strong relationships with key decision makers and build credibility at all levels.&lt;/li&gt; &lt;li&gt;Effective group-facilitation skills and confidence in proposing and leading customer meetings to gain strategic footing and pursue opportunities.&lt;/li&gt; &lt;li&gt;Thorough understanding of the software development lifecycle and API architecture.&lt;/li&gt; &lt;li&gt;Outstanding spoken and written communication skills, presentation skills, and confidence in explaining complex concepts to both technical and non-technical audiences.&lt;/li&gt; &lt;li&gt;Ability to learn Stripe solutions such as Payments, Billing, Connect, and more.&lt;/li&gt; &lt;li&gt;Ability to understand how a wide variety of applications such as ERP, CRM, Billing, Tax and legacy systems interact with each other in an enterprise technology ecosystem.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Strong organisational and time management skills and the ability to juggle competing priorities while working with multiple strategic opportunities and customers.&lt;/li&gt; &lt;li&gt;Strategic and creative thinker who can proactively identify challenges and maintain a positive approach when facing difficult obstacles.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;"
