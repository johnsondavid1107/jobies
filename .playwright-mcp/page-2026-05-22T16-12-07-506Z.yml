            - generic [ref=e44]: "&lt;h3&gt;About Stripe&lt;/h3&gt; &lt;p&gt;Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world&#39;s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone&#39;s reach while doing the most important work of your career.&lt;/p&gt; &lt;h3&gt;About the team&lt;/h3&gt; &lt;p&gt;The Marketing Operations team is responsible for the systems, processes, and data infrastructure that power Stripe&#39;s global marketing engine. We partner closely with Growth, Demand Generation, Regional Marketing, Lifecycle, Sales Development, and Marketing Technology teams to ensure campaigns are executed with precision, prospect data is accurate and actionable, and our marketing technology stack operates at scale.&lt;/p&gt; &lt;p&gt;We are systems thinkers and operational leaders focused on improving the workflows, tooling, data quality, and processes that enable marketing and sales teams to move faster and more effectively. Our work spans campaign operations, marketing automation, prospect data management, and cross-functional program delivery.&lt;/p&gt; &lt;h2&gt;What you&#39;ll do&lt;/h2&gt; &lt;p&gt;We are looking for a Marketing Operations Program Manager, Sold Funnel that sits at the intersection of technology, data, and program management. The role requires someone who can deeply understand and balance the needs of internal stakeholders and prospective customers with an exceptional capacity to deliver with urgency.&lt;/p&gt; &lt;p&gt;You will serve as a process owner and driver of key sales development workstreams, partnering with marketing, sales development, and internal product and engineering. You will deliver scalable solutions that improve sales development efficiency and grow qualified opportunities and pipeline.&lt;/p&gt; &lt;h3&gt;Responsibilities&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Create and lead programs to transform sales development with AI SDRs&lt;/li&gt; &lt;li&gt;Lead requirements, selection, contracting, implementation, and adoption of third party software; drive new custom features in the company’s implementation of third party software&lt;/li&gt; &lt;li&gt;Own end-to-end program delivery for initiatives; maintain program communications; address recurring sales development operational challenges; define objectives, success metrics, and build repeatable processes that scale&lt;/li&gt; &lt;li&gt;Partner with product and engineering teams to scope business requirements, coordinate discovery, and translate operational needs into product requirements for internal tooling&lt;/li&gt; &lt;li&gt;Coordinate review cycles, pilots, and feedback collection during program execution; summarize required changes, identify launch-blocking issues, and escalate risks as needed&lt;/li&gt; &lt;li&gt;Drive ongoing operations improvements through process innovation, automation, and the adoption of AI-powered tools to increase productivity and transform workflows&lt;/li&gt; &lt;li&gt;Maintain scalable documentation and support coordination with local and global teams and cross-functional partners across time zones&lt;/li&gt; &lt;li&gt;Partner with sales development managers and analysts to define metrics, create dashboards, and implement regular dashboard reviews to ensure adoption and impact of initiatives&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Who you are&lt;/h2&gt; &lt;p&gt;We&#39;re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.&lt;/p&gt; &lt;h3&gt;Minimum requirements&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;6+ years of experience in B2B marketing/sales/revenue operations or a related program management role in a high-growth technology environment&lt;/li&gt; &lt;li&gt;3+ years of experience working day-to-day with CRM platforms, lead management, and Sales Development tools like Gong, Salesloft, Outreach, Orum, Dialpad, Vidyard, Qualified, and Clay&lt;/li&gt; &lt;li&gt;3+ years of experience in end-to-end program management of cross-functional marketing, sales, and engineering initiatives&lt;/li&gt; &lt;li&gt;Experience building AI agents, including examples of agents you have deployed and examples of ways you are using AI on a daily basis beyond chat&lt;/li&gt; &lt;li&gt;3+ years of experience doing your own analysis using queries, dashboards, and AI and partnering with analysts and data scientists for more complex analytics needs&lt;/li&gt; &lt;li&gt;3+ years of experience defining your own scope and goals and collaborating with a distributed, global team to deliver on them&lt;/li&gt; &lt;li&gt;Excellent written and verbal communication skills, including the ability to convey complex operational concepts to diverse stakeholders across marketing, sales, and engineering&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;Preferred qualifications&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;3+ years of experience with Salesforce, including lead management, campaign attribution, and marketing-to-sales data flows&lt;/li&gt; &lt;li&gt;Experience implementing AI tools to improve marketing operations workflows and productivity&lt;/li&gt; &lt;li&gt;Experience working with global teams on a day-to-day basis&lt;/li&gt; &lt;li&gt;Experience in the financial services, payments, or B2B software industries&lt;/li&gt; &lt;/ul&gt;"
