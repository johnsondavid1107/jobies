            - generic [ref=e88]: "&lt;h2&gt;&lt;strong&gt;Who we are&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;About Stripe&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Stripe, LLC. is a financial infrastructure platform for businesses. Millions of companies - from the world’s largest enterprises to the most ambitious startups - use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone&#39;s reach while doing the most important work of your career.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Collaborate with Engineering, Product Management, Design and other cross-functional teams to build and scale operational infrastructure that supports the launch of innovative products, ensuring a seamless user experience.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Lead multiple projects simultaneously, managing timelines, resources, and stakeholder expectations to deliver impactful results that align with Stripe&#39;s goals.&lt;/li&gt; &lt;li&gt;Ensure the operations team continuously delivers high quality customer outcomes, through quality monitoring, training, metric observability and process improvement.&lt;/li&gt; &lt;li&gt;Partner directly with customers to develop Standard Operating Procedures for supporting new Stripe lines of business.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Lead operational reviews with customers to communicate operational performance and uncover customer concerns.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Identify critical operational requirements from partner banks and card networks and ensure we can fulfil them.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;Minimum requirements&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Bachelor’s degree or foreign equivalent in Business, Management Science, Computing, Finance or a related field, plus 2 years of experience in product or project strategy in a high-tech growth environment .&lt;/p&gt; &lt;p&gt;Position also requires the following:&amp;nbsp;&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;2 years of experience in executing and delivering complex operational projects working directly with diverse, distributed teams and their cross-functional stakeholders.&lt;/li&gt; &lt;li&gt;2 years of experience in working in a fast-paced work environment crafting rapid and strategic fixes to high intensity, sensitive problems.&lt;/li&gt; &lt;li&gt;2 years of experience in crafting written and verbal communications designed to solve user problems.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Salary&lt;/strong&gt;: $140,400 - $210,600/yr.&amp;nbsp;&lt;/p&gt; &lt;p&gt;This salary range represents the base salary range for the role and any sales commissions/sales bonuses targets, if applicable, would be in addition to the base salary.&lt;/p&gt; &lt;p&gt;40 hrs/week.&lt;/p&gt; &lt;p&gt;50% telecommuting permitted.&amp;nbsp;&lt;/p&gt; &lt;p&gt;Travel Requirement: 5% for meetings and onsites.&lt;/p&gt; &lt;p&gt;Multiple Positions Available.&lt;/p&gt; &lt;p&gt;Additional benefits for this role may include: equity, company bonus or sales commissions/bonuses; 401(k) plan; medical, dental, and vision benefits; and wellness stipends. NY08 &lt;span style=&quot;color: rgb(255, 255, 255);&quot;&gt;#LI-DNI&lt;/span&gt;&lt;/p&gt;"
