            - generic [ref=e54]: "&lt;h2&gt;&lt;strong&gt;Who we are&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;About Stripe&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world’s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone’s reach while doing the most important work of your career.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;The Infrastructure and Data Experiences Product Team (“IDX” for short) is responsible for ensuring that Stripe’s major engineering systems are meeting the needs of our customers - both internal teams and external users. We partner closely with Stripe’s CTO, Engineering leads and Product leads across Stripe to define technology vision, product capabilities, and roadmaps, while delivering reliable experiences for our customers&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;As a Product Manager on the team, you&#39;ll work with Stripe tech leaders to:&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Grow the business through delightful user experiences and reliable infrastructure&lt;/li&gt; &lt;li&gt;Streamline decision making and business operations through state of the art systems&lt;/li&gt; &lt;li&gt;Deliver the best experience for developers in the industry&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Stripe’s infrastructure is composed of high availability distributed systems that power Stripe products. We’re looking for a product manager who loves developers and works with them daily to understand their needs, has a knack for building beautiful product experiences with ergonomic user journeys, isn’t afraid of understanding large technical systems, and prioritizes users and business impact. The problems you will be working on are critical to unlock the next phase of growth at Stripe, ranging from unlocking international markets through local infrastructure to powering enterprise-grade experiences.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Responsibilities&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Partner with the engineering teams, including Core Infra, Developer Infra, Data Platform, and Service Platform, to ship functionality that delights users, has the right balance of impact vs engineering cost, and makes a measurable impact on the business&lt;/li&gt; &lt;li&gt;Establish system and design principles for how we build, buy, and operate Seller Systems — ensuring we select the right long-term solutions, not short-term patches.&lt;/li&gt; &lt;li&gt;Guide architecture and investment decisions, weighing trade-offs between build vs. buy, modernization vs. extension, and platform vs. point solution to maintain a cohesive, sustainable ecosystem.&lt;/li&gt; &lt;li&gt;Interact with external users and propose critical infrastructure abstractions that best serve them&lt;/li&gt; &lt;li&gt;Validate product ideas and prototypes with early adopters&lt;/li&gt; &lt;li&gt;Define key success metrics for developer products&lt;/li&gt; &lt;li&gt;Work on infrastructure, API, data models/pipelines roadmaps&amp;nbsp;&lt;/li&gt; &lt;li&gt;Work on internal AI agents for specific functions such as Recruiting, Legal etc. to aid productivity and great customer experience&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;We’re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Minimum requirements&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Our ideal Product Manager will be relentlessly user-focused, highly analytical, comfortable in ambiguity, have strong technical skills, and the desire to create something new.&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;7+ years of progressive experience&lt;/strong&gt; in Product Management, ideally within an enterprise or B2B setting.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Demonstrated success&lt;/strong&gt; in defining, launching, and scaling complex products from ideation to general availability in an enterprise environment.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Proven ability to manage diverse stakeholders&lt;/strong&gt; (Engineering, Design, Sales, Marketing, Executive Leadership) and drive cross-functional alignment on product vision and prioritization.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Exceptional ability to map, analyze, and refine Customer User Journeys (CUJs)&lt;/strong&gt; to identify high-value pain points and opportunities for AI solution deployment.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Highly data-driven approach&lt;/strong&gt; to prioritization and decision-making, including the ability to define key performance indicators (KPIs), create product impact dashboards, and synthesize data into actionable product requirements.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;A track record of leveraging qualitative (customer interviews) and quantitative (product usage data)&lt;/strong&gt; insights to validate assumptions and drive product strategy.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Excellent written and verbal communication skills&lt;/strong&gt;, with the ability to articulate complex technical concepts and product strategies clearly to both technical and non-technical audiences.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;AI &amp;amp; Technical Expertise&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Hands-on experience&lt;/strong&gt; developing and launching AI/ML-powered products or features for internal or external customers.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Robust functional and technical understanding of Large Language Models (LLMs)&lt;/strong&gt; and common AI-based workflows (e.g., retrieval-augmented generation, fine-tuning, prompt engineering).&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Prior experience&lt;/strong&gt; working directly with LLMs or launching conversational AI agents into production.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Technical background&lt;/strong&gt; (e.g., Computer Science degree or equivalent practical experience) that allows for deep engagement with engineering teams on technical trade-offs and architectural decisions.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Preferred qualifications&amp;nbsp;&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience working with cross-geo/timezone environments&lt;/li&gt; &lt;li&gt;Track record of solving high-impact, cross-system challenges and aligning senior stakeholders across Product, Engineering, and Core infrastructure organizations.&lt;/li&gt; &lt;/ul&gt;"
