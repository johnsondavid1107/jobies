            - generic [ref=e83]: "&lt;h2&gt;&lt;strong&gt;Who we are&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;About Stripe&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world’s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone’s reach while doing the most important work of your career.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Product Marketing is a global team of capable, friendly, user-oriented marketers, partnering closely with Stripe’s world-class product and engineering teams.&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Our Product Marketing team’s mission is to generate customer insights that inform Stripe’s product strategy, lead go-to-market for our suite of products, and create and execute campaigns to drive product growth.&lt;/li&gt; &lt;li&gt;Product Marketing is a highly cross-functional role at Stripe, partnering closely with Product and Engineering, Sales, Design, Developer Relations, and Communications to name a few.&lt;/li&gt; &lt;li&gt;Different from many other Product Marketing teams, our team is focused on Stripe&#39;s full product portfolio—translating the breadth of what Stripe builds into clear narratives and product experiences across web, dashboard, mobile, docs, and developer tools.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;We&#39;re looking for an experienced Product Marketing Manager to own the positioning, messaging, and go-to-market strategy for Stripe Apps, Stripe Projects, the App Marketplace, and the broader partner ecosystem. This is a combined role that sits at the intersection of product, partnerships, and marketing — responsible for defining how the world sees Stripe&#39;s ecosystem of apps, integrations, and partner solutions as a strategic differentiator.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Define the value proposition of the App Marketplace and broader partner ecosystem for developers, customers, partners, and internal teams—building distinct messaging for both supply-side partners (those building on Stripe) and demand-side users (those adopting solutions).&lt;/li&gt; &lt;li&gt;Build messaging and competitive positioning frameworks that show how our ecosystem extends Stripe&#39;s core products and differentiates us vs. alternatives.&lt;/li&gt; &lt;li&gt;Partner with Product, Partnerships, PMM, and Partner Marketing to launch new Apps, Marketplace categories and partner solutions — ensuring they&#39;re woven into product launches and big moments (Sessions, Tour, announcements).&lt;/li&gt; &lt;li&gt;Collaborate with Partner Marketing on case studies, demand gen, and narratives that showcase ecosystem adoption and network effects.&lt;/li&gt; &lt;li&gt;Develop GTM playbooks, solution briefs, pitch decks, and battlecards so field teams can sell ecosystem and Marketplace solutions.&lt;/li&gt; &lt;li&gt;Track adoption performance (app installs, Projects activation rates, partner-sourced pipeline, app builds, extension adoptions etc.), benchmark against competitors, and provide insights to product and partnerships teams on where to invest. Engage Analyst Relations to elevate Stripe&#39;s ecosystem visibility externally.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;We’re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;A storyteller. You have deep empathy for users and are able to adapt how you communicate to best reach and engage your audience—from developers to technical and non-technical founders—and differentiate Stripe. You have excellent verbal and written communication skills.&lt;/li&gt; &lt;li&gt;Customer-obsessed. You&#39;re practiced in qualitative research methods — user interviews, survey design, synthesis — and know how to turn what you hear from customers into strategic inputs that sharpen messaging and prioritize programs.&lt;/li&gt; &lt;li&gt;Structured and strategic. You bring order to complexity. You’re able to distill ambiguous inputs into clear frameworks, roadmaps, and priorities.&lt;/li&gt; &lt;li&gt;Data-oriented. You like working with data and insights and pair that with your passion for users to generate balanced and thoughtful points of view for how to take our products to market.&lt;/li&gt; &lt;li&gt;Organized. You are able to manage highly interdependent, complex projects and keep various work streams on track.&lt;/li&gt; &lt;li&gt;Ambitious. You are eager to make an impact at Stripe. You thrive in a fast-moving environment and working with passionate sales teams, are able to operate fluidly between the 30,000-foot strategy level and the micro-detail to get things right.&lt;/li&gt; &lt;li&gt;A team player. This role collaborates across Product, Partnerships, Partner Marketing, PMM, Sales, Design, Comms, and Developer Relations. You work well across disciplines and can influence without authority.&lt;/li&gt; &lt;li&gt;Ecosystem-minded. You think in terms of platforms, network effects, and partner value chains — not just individual product lines. You understand how marketplaces and ecosystems create compounding value.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;em&gt;&lt;strong&gt;AI-fluent.&lt;/strong&gt; You actively use AI tools to accelerate research, content creation, and analysis. You&#39;re curious about how AI is reshaping ecosystems and marketplaces, and you bring that lens to your positioning work.&lt;/em&gt;&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Minimum requirements&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;5-7 years of relevant work experience spanning product marketing, platform/ecosystem marketing, partner marketing, or product management.&lt;/li&gt; &lt;li&gt;At least 3-5 years of marketing or go-to-market experience in a B2B SaaS or platform environment.&lt;/li&gt; &lt;li&gt;Strong writing skills with a portfolio of customer-facing content or campaigns.&lt;/li&gt; &lt;li&gt;Demonstrated experience marketing a two-sided marketplace or platform—including both supply-side (partner/developer acquisition and enablement) and demand-side (end-user adoption) motions.&lt;/li&gt; &lt;li&gt;Experience working cross-functionally with product, partnerships, and sales teams.&lt;/li&gt; &lt;li&gt;Demonstrated ability to develop product positioning and messaging frameworks, with experience translating technical or complex products into clear value propositions for distinct audiences.&lt;/li&gt; &lt;li&gt;Hands-on experience executing end-to-end product or feature launches: owning timelines, writing launch briefs, and coordinating cross-functional teams across product, comms, and marketing.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Preferred qualifications&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience marketing a developer-facing marketplace or app ecosystem.&lt;/li&gt; &lt;li&gt;Familiarity with partner program structures and how marketplaces drive distribution and adoption.&lt;/li&gt; &lt;li&gt;Experience working with the startup founder or developer audience.&lt;/li&gt; &lt;li&gt;Background in payments, fintech, or infrastructure platforms.&lt;/li&gt; &lt;li&gt;Enough technical literacy to navigate API documentation and work credibly with developer-facing products and partners — comfortable translating integration patterns into user-facing messaging.&lt;/li&gt; &lt;li&gt;Familiarity with ecosystem or marketplace metrics such as app adoption rates, marketplace attach, partner-sourced pipeline, or partner program health indicators.&lt;/li&gt; &lt;/ul&gt;"
