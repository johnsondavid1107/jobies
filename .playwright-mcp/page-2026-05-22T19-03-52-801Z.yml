            - generic [ref=e112]: "&lt;h2&gt;&lt;strong&gt;Who we are&lt;/strong&gt;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;About Stripe&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world’s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone’s reach while doing the most important work of your career.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;About the team&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;Product Marketing is a global team of capable, friendly, user-oriented marketers, partnering closely with Stripe’s world-class product and engineering teams.&amp;nbsp;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Our Product Marketing team’s mission is to generate customer insights that inform Stripe’s product strategy, lead go-to-market for our suite of products, and create and execute campaigns to drive product growth.&lt;/li&gt; &lt;li&gt;Product Marketing is a highly cross-functional role at Stripe, partnering closely with Product and Engineering, Sales, Design, Developer Relations, and Communications to name a few.&lt;/li&gt; &lt;li&gt;Different from many other Product Marketing teams, our team is focused on Stripe&#39;s full product portfolio—translating the breadth of what Stripe builds into clear narratives and product experiences across web, dashboard, mobile, docs, and developer tools. Rather than owning individual product launches, our focus is on driving portfolio-level discovery and adoption across the entire user journey.&amp;nbsp;&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;What you’ll do&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;We&#39;re looking for an experienced Growth Product Marketer to help us define and build compelling user journeys for our self-serve customers. You&#39;ll partner closely with Growth, Product, and Product Marketing teams to understand the needs of our users — from signup through activation and expansion — and craft messaging and content that drives user education, product adoption, and cross-sell/upsell.&lt;/p&gt; &lt;p&gt;This role is equal parts analytical and creative. You&#39;ll dig into data to understand where users get stuck, then use storytelling and sharp messaging to build experiences that move them forward. You&#39;ll work across the full self-serve lifecycle: onboarding, activation, product discovery, and multi-product expansion — shipping programs that directly drive measurable business outcomes.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Partner with Growth product and engineering teams to understand user journeys, identify friction points and drop-off, and define where marketing content can accelerate activation and adoption.&lt;/li&gt; &lt;li&gt;Develop messaging and content strategy for lifecycle touchpoints — including marketing emails, dashboard modules (Getting Started Modules, Insight Modules), and in-product surfaces — ensuring the right message reaches the right user at the right time.&lt;/li&gt; &lt;li&gt;Own end-to-end execution of growth marketing programs: write briefs, develop copy frameworks, manage legal and compliance review, coordinate with MarTech/MOPS, and ship globally localized campaigns.&lt;/li&gt; &lt;li&gt;Serve as a user advocate — deeply understand our self-serve segments (startups, SMBs, developers) and what motivates them at each stage of their journey. Translate complex product value into clear, compelling narratives that drive action.&lt;/li&gt; &lt;li&gt;Design and run experiments to optimize messaging, targeting, and channel mix. Track results rigorously — CTR, quality scores, activation rates, conversion — and use data to iterate and improve.&lt;/li&gt; &lt;li&gt;Drive cross-sell and upsell programs that help existing users discover and adopt additional Stripe products, using behavioral signals, timing windows, and personalized content.&lt;/li&gt; &lt;li&gt;Work cross-functionally across Growth, Product, PMM, Data Science, Lifecycle Marketing, and external agencies to deliver seamless execution across channels and touchpoints. Manage complex, multi-stakeholder projects with many interdependencies.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Who you are&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;We’re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Data-driven and analytically rigorous. You&#39;re comfortable pulling insights from dashboards and experiments, defining KPIs, and using data to tell the story of what&#39;s working and what&#39;s not.&amp;nbsp;&lt;/li&gt; &lt;li&gt;Customer-obsessed. You understand what it&#39;s like to be a developer or founder trying to get a product off the ground, and you use that empathy to craft experiences that genuinely help. You&#39;re practiced in qualitative research methods — user interviews, survey design, synthesis — and know how to turn what you hear from customers into strategic inputs that sharpen messaging and prioritize programs.&lt;/li&gt; &lt;li&gt;A sharp, fast writer. You can produce polished, compelling customer-facing copy — from email subject lines to value propositions to product education content. You know how to say more with less.&lt;/li&gt; &lt;li&gt;A strategic storyteller. You know how to build positioning from the ground up — translating product capability into differentiated value for specific audiences. You&#39;ve developed messaging architectures that hold up across an email subject line, a pitch deck, and a product page.&lt;/li&gt; &lt;li&gt;Highly organized and execution-oriented. You manage complex programs with many moving parts (legal reviews, localization, MarTech setup, experimentation) and keep everything on track without dropping balls.&lt;/li&gt; &lt;li&gt;A strong collaborator. You build trust quickly across Growth, Product, Engineering, Data Science, and Marketing teams. You influence without authority and bring people together to ship great work.&lt;/li&gt; &lt;li&gt;A clear, confident communicator. You can write a tight exec update as readily as a customer email. You&#39;re comfortable presenting strategy and results to senior leadership, building the narrative that gets stakeholders aligned, and representing marketing&#39;s point of view in high-stakes conversations.&lt;/li&gt; &lt;li&gt;Bias for action. You move fast, test quickly, and don&#39;t wait for perfect information. You&#39;d rather ship an experiment and learn than spend weeks debating the plan.&lt;/li&gt; &lt;li&gt;AI-fluent. You actively use AI tools to accelerate your work — whether that&#39;s drafting copy, analyzing data, building briefs, or streamlining operations. You see AI as a force multiplier and are always looking for ways to work smarter.&lt;/li&gt; &lt;li&gt;Creative and scrappy. You enjoy finding the insight that unlocks a great message. You&#39;re as comfortable brainstorming a positioning angle as you are wrangling a spreadsheet of audience targeting parameters.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Minimum requirements&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;5-7 years of relevant work experience in product marketing, growth marketing, lifecycle marketing, or a related field.&lt;/li&gt; &lt;li&gt;At least 3 years of experience in B2B SaaS or platform environments, ideally working with self-serve or product-led growth motions.&lt;/li&gt; &lt;li&gt;Track record of working cross-functionally with product, engineering, and data teams to ship growth initiatives.&lt;/li&gt; &lt;li&gt;Comfortable digging into data and self-serving insights; knowledge of SQL is nice to have but not required.&lt;/li&gt; &lt;li&gt;Strong writing skills with a portfolio of customer-facing content or campaigns.&lt;/li&gt; &lt;li&gt;Demonstrated ability to develop product positioning and messaging frameworks, with experience translating technical or complex products into clear value propositions for distinct audiences.&lt;/li&gt; &lt;li&gt;Experience presenting program strategy and results to senior leadership; able to communicate complex tradeoffs clearly and build alignment across functions.&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Preferred qualifications&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience working with developer, startup, and SMB audiences.&lt;/li&gt; &lt;li&gt;Familiarity with experimentation frameworks and growth metrics.&lt;/li&gt; &lt;li&gt;Experience with marketing automation platforms and growth tooling (CRM platforms, in-product messaging, experimentation frameworks).&lt;/li&gt; &lt;li&gt;Background in payments, fintech, or infrastructure platforms.&lt;/li&gt; &lt;li&gt;Experience building or launching mobile marketing channels, including push notifications or in-app messaging—particularly defining message types, cadence, and UX guidelines.&lt;/li&gt; &lt;li&gt;Experience producing or scaling product video content, ideally using AI-assisted tools or workflows to accelerate production and reduce time-to-publish.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/li&gt; &lt;/ul&gt;"
